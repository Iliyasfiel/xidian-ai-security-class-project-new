name: Workbench offline checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked project04 environment
        run: |
          python -m pip install uv==0.12.10
          uv sync --frozen --python 3.11 --project "projects/project-04-Intelligence Gathering"
      - name: Run offline workflow and regression
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) python_bin="projects/project-04-Intelligence Gathering/.venv/Scripts/python.exe" ;;
            *) python_bin="projects/project-04-Intelligence Gathering/.venv/bin/python" ;;
          esac
          "$python_bin" -m workbench.verify_offline outputs/ci-offline
          "$python_bin" -m pytest -q workbench/tests/test_workbench_m1.py workbench/tests/test_scientist02_journal.py workbench/tests/test_offline_protocol.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/project-04-Intelligence Gathering/webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
